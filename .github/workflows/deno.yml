name: Deno

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ⚠️ Lint désactivé temporairement — sera réactivé après nettoyage
      # - name: Run linter
      #   run: deno lint

      - name: Run tests
        run: deno test -A
        continue-on-error: true
