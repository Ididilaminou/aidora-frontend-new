<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         FAVICON
         ============================================================ -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ============================================================
         SEO DE BASE
         ============================================================ -->
    <title>Aidora — Chaque goutte sauve une vie</title>
    <meta
      name="description"
      content="Aidora connecte les donneurs de sang aux banques et hôpitaux du Cameroun. Trouvez un donneur, prenez rendez-vous et sauvez des vies en quelques clics."
    />
    <meta
      name="keywords"
      content="don de sang, Cameroun, banque de sang, donneur, hôpital, Aidora, transfusion, urgence"
    />
    <meta name="author" content="Aidora" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="language" content="fr" />

    <!-- ============================================================
         OPEN GRAPH (WhatsApp, Facebook, LinkedIn)
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aidora.cm/" />
    <meta property="og:title" content="Aidora — Chaque goutte sauve une vie" />
    <meta
      property="og:description"
      content="La première plateforme camerounaise qui connecte les donneurs de sang aux banques et hôpitaux. Rejoignez des milliers de donneurs."
    />
    <meta property="og:image" content="https://aidora.cm/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aidora — Plateforme de don de sang" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Aidora" />

    <!-- ============================================================
         TWITTER CARD
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://aidora.cm/" />
    <meta name="twitter:title" content="Aidora — Chaque goutte sauve une vie" />
    <meta
      name="twitter:description"
      content="Connectez-vous aux donneurs de sang près de chez vous au Cameroun."
    />
    <meta name="twitter:image" content="https://aidora.cm/og-image.png" />

    <!-- ============================================================
         POLICES
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- ============================================================
         DONNÉES STRUCTURÉES (JSON-LD pour Google)
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Aidora",
        "url": "https://aidora.cm",
        "logo": "https://aidora.cm/logo.png",
        "description": "Plateforme camerounaise de mise en relation entre donneurs de sang et banques de sang.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Yaounde",
          "addressCountry": "CM"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "contact@aidora.cm",
          "contactType": "customer service",
          "availableLanguage": ["fr", "en"]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
